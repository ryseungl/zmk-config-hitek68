<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitek68 Keybind Editor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Hitek68</h1>
  <div class="header-right">
    <div id="battery" class="battery" title="Half battery levels">
      <span id="bat-l">L --%</span>
      <span id="bat-r">R --%</span>
    </div>
    <div id="status" class="status disconnected">Connecting…</div>
  </div>
</header>

<nav id="layers"></nav>

<main>
  <div id="board-wrap">
    <svg id="board" viewBox="0 0 1600 650"></svg>
  </div>
  <div id="hint">Click a key to edit its binding.</div>
</main>

<div id="toolbar">
  <button id="save-btn" disabled>Save to keyboard</button>
  <button id="discard-btn" disabled>Discard changes</button>
  <span id="unsaved-note"></span>
  <span class="spacer"></span>
  <label class="sleep-label">Sleep
    <input id="sleep-minutes" type="number" min="0" max="1440" value="30" title="Minutes of idle before deep sleep (0 = never)">
    <span class="unit">min</span>
  </label>
  <select id="sleep-target" title="Which half">
    <option value="both">Both halves</option>
    <option value="left">Left</option>
    <option value="right">Right</option>
  </select>
  <button id="sleep-apply">Apply</button>
</div>

<div id="picker" class="hidden">
  <div class="picker-card">
    <h2 id="picker-title">Edit key</h2>
    <label>Behavior
      <select id="behavior-select"></select>
    </label>
    <label>Key
      <input id="key-search" type="text" placeholder="Type to search keycodes…" autocomplete="off">
      <select id="key-select" size="8"></select>
    </label>
    <label id="layer-param-wrap" class="hidden">Layer
      <input id="layer-param" type="number" min="0" max="9" value="1">
    </label>
    <div class="picker-actions">
      <button id="picker-apply">Apply</button>
      <button id="picker-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
