# hitek68_dongle: BLE split central with no keys of its own.
# Applied automatically to the hitek68_dongle shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Two peripherals (left + right halves) connect to this central.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2 split peripherals + 5 host BLE profiles.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
