# hitek68_dongle: BLE split central with no keys of its own.
# Applied automatically to the hitek68_dongle shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Two peripherals (left + right halves) connect to this central.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# 2 split peripherals, 0 host BLE profiles: the dongle is USB-only to the
# host and can never pair as a Bluetooth keyboard.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2

# ZMK Studio: live keymap editing over USB (via the studio-rpc-usb-uart
# snippet in build.yaml). Locking disabled: anyone with USB access can
# remap; re-enable CONFIG_ZMK_STUDIO_LOCKING for an unlock sequence.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Peripheral battery monitoring: fetch battery levels from both halves over
# BLE and proxy them so ZMK Studio (and the host) can display them.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Extra USB HID interface for battery reporting to host app.
# HID_0 = ZMK keyboard, HID_1 = vendor battery interface.
CONFIG_USB_HID_DEVICE_COUNT=2
