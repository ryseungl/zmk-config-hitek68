# hitek68_right: BLE split peripheral (key scanning half).
# Applied automatically to the hitek68_right shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# Required for the EC11 rotary encoder.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Deep sleep timeout is runtime-adjustable via hitek68_sleep.c (default 30 min).
# Keep CONFIG_ZMK_SLEEP=y so zmk_pm_suspend_devices() etc. are compiled in,
# but set ZMK's own idle timeout to max so only our runtime code triggers sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2147483647
CONFIG_SETTINGS=y
