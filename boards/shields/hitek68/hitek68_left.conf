# hitek68_left: BLE split peripheral (key scanning half).
# Applied automatically to the hitek68_left shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# Required for the EC11 rotary encoder.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Deep sleep handled by hitek68_sleep.c (runtime-adjustable timeout, default
# 30 min). ZMK's compile-time sleep must stay off to avoid double handling.
# CONFIG_ZMK_SLEEP is not set
CONFIG_SETTINGS=y
