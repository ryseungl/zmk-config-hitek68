# hitek68_left: BLE split peripheral (key scanning half).
# Applied automatically to the hitek68_left shield build.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# Required for the EC11 rotary encoder.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Deep sleep after 30 minutes idle (1800000 ms). Any keypress wakes the half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
